name: Release

# Push a tag such as v0.2.0 that matches the version in Cargo.toml. It publishes the
# downloads as a GitHub release, then the website and the Homebrew tap.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Tag matches Cargo.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME, Cargo.toml $version"; exit 1; }
      - name: Test
        run: cargo test --locked
        timeout-minutes: 10
      - name: Build the downloads
        run: tools/release.sh
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          {
            awk -v v="## $version " 'index($0, v) == 1 { on = 1; next } /^## / { on = 0 } on' CHANGELOG.md
            echo
            cat .github/release-notes.md
          } >"$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" target/dist/* \
            --title "Hoardmap $version" \
            --notes-file "$RUNNER_TEMP/notes.md"

  pages:
    needs: release
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml

  # Points the abhishekkundu25/homebrew-tap recipes at the new release. TAP_DEPLOY_KEY is
  # the private half of a deploy key with write access to that repo only.
  tap:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Update the tap
        run: |
          if [ -z "$TAP_DEPLOY_KEY" ]; then
            echo "::warning::TAP_DEPLOY_KEY is not set; the Homebrew tap was not updated"
            exit 0
          fi
          version=${GITHUB_REF_NAME#v}
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS
          sum() { awk -v f="$1" '$2 == f { print $1 }' SHA256SUMS; }
          app=$(sum Hoardmap.zip)
          cli=$(sum hoardmap-macos.tar.gz)
          test -n "$app" && test -n "$cli"

          mkdir -p ~/.ssh
          printf '%s\n' "$TAP_DEPLOY_KEY" >~/.ssh/tap
          chmod 600 ~/.ssh/tap
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/tap -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone --depth 1 git@github.com:abhishekkundu25/homebrew-tap.git tap
          cd tap
          sed -i -E "s/^  version \".*\"/  version \"$version\"/; s/^  sha256 \".*\"/  sha256 \"$app\"/" Casks/hoardmap.rb
          sed -i -E "s|/download/v[^/]+/|/download/v$version/|; s/^  version \".*\"/  version \"$version\"/; s/^  sha256 \".*\"/  sha256 \"$cli\"/" Formula/hoardmap.rb
          git diff --stat
          if git diff --quiet; then exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qam "Hoardmap $version"
          git push origin HEAD:main
