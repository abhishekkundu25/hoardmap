name: Release

# Push a tag such as v0.2.0 that matches the version in Cargo.toml. It publishes the
# downloads as a GitHub release, then the website.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Tag matches Cargo.toml
        run: |
          version=${GITHUB_REF_NAME#v}
          {
            awk -v v="## $version " 'index($0, v) == 1 { on = 1; next } /^## / { on = 0 } on' CHANGELOG.md
            echo
            cat .github/release-notes.md
          } >"$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" target/dist/* \
            --title "Hoardmap $version" \
            --notes-file "$RUNNER_TEMP/notes.md"|
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME, Cargo.toml $version"; exit 1; }
      - name: Test
        run: cargo test --locked
        timeout-minutes: 10
      - name: Build the downloads
        run: tools/release.sh
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          {
            awk -v v="## $version " 'index($0, v) == 1 { on = 1; next } /^## / { on = 0 } on' CHANGELOG.md
            echo
            cat .github/release-notes.md
          } >"$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" target/dist/* \
            --title "Hoardmap $version" \
            --notes-file "$RUNNER_TEMP/notes.md"

  pages:
    needs: release
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
