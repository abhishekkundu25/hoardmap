<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2f6e"/>
      <stop offset="0.5" stop-color="#1c1e4e"/>
      <stop offset="1" stop-color="#0d0e2a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.32" cy="0.38" r="0.6">
      <stop offset="0" stop-color="#ffb84a" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffcf5a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.14"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff1a8"/>
      <stop offset="0.35" stop-color="#ffd23f"/>
      <stop offset="1" stop-color="#e8890c"/>
    </linearGradient>
    <linearGradient id="coral" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff8a7a"/><stop offset="1" stop-color="#e5414f"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5ff0d2"/><stop offset="1" stop-color="#14a89a"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6ab8ff"/><stop offset="1" stop-color="#2f6ff0"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c79bff"/><stop offset="1" stop-color="#7c4dea"/>
    </linearGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff9ad5"/><stop offset="1" stop-color="#e2489c"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b6f37a"/><stop offset="1" stop-color="#4fbf3a"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fe6ff"/><stop offset="1" stop-color="#3aa6d8"/>
    </linearGradient>
    <linearGradient id="tileSheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.45"/>
      <stop offset="0.45" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="iconShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <filter id="tileShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#05061a" flood-opacity="0.55"/>
    </filter>
    <filter id="sparkGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="plateClip"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
    <symbol id="spark" viewBox="-50 -50 100 100">
      <path d="M0-50 C6-14 14-6 50 0 C14 6 6 14 0 50 C-6 14 -14 6 -50 0 C-14 -6 -6 -14 0-50Z" fill="#fff"/>
    </symbol>
  </defs>

  <g filter="url(#iconShadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#plate)"/>
  </g>
  <g clip-path="url(#plateClip)">
    <rect x="100" y="100" width="824" height="824" fill="url(#glow)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#sheen)"/>
  </g>
  <rect x="101.5" y="101.5" width="821" height="821" rx="184" fill="none" stroke="#fff" stroke-opacity="0.12" stroke-width="3"/>

  <g filter="url(#tileShadow)">
    <rect x="212" y="212" width="340" height="372" rx="34" fill="url(#gold)"/>
    <rect x="576" y="212" width="236" height="200" rx="30" fill="url(#coral)"/>
    <rect x="576" y="436" width="236" height="148" rx="28" fill="url(#teal)"/>
    <rect x="212" y="608" width="220" height="204" rx="30" fill="url(#blue)"/>
    <rect x="456" y="608" width="160" height="204" rx="28" fill="url(#violet)"/>
    <rect x="640" y="608" width="74" height="90" rx="18" fill="url(#mint)"/>
    <rect x="738" y="608" width="74" height="90" rx="18" fill="url(#pink)"/>
    <rect x="640" y="722" width="172" height="90" rx="20" fill="url(#sky)"/>
  </g>
  <g>
    <rect x="212" y="212" width="340" height="372" rx="34" fill="url(#tileSheen)"/>
    <rect x="576" y="212" width="236" height="200" rx="30" fill="url(#tileSheen)"/>
    <rect x="576" y="436" width="236" height="148" rx="28" fill="url(#tileSheen)"/>
    <rect x="212" y="608" width="220" height="204" rx="30" fill="url(#tileSheen)"/>
    <rect x="456" y="608" width="160" height="204" rx="28" fill="url(#tileSheen)"/>
    <rect x="640" y="608" width="74" height="90" rx="18" fill="url(#tileSheen)"/>
    <rect x="738" y="608" width="74" height="90" rx="18" fill="url(#tileSheen)"/>
    <rect x="640" y="722" width="172" height="90" rx="20" fill="url(#tileSheen)"/>
    <rect x="213.5" y="213.5" width="337" height="369" rx="32.5" fill="none" stroke="#fff" stroke-opacity="0.55" stroke-width="3"/>
  </g>

  <g filter="url(#sparkGlow)">
    <use href="#spark" x="302" y="318" width="160" height="160"/>
    <use href="#spark" x="440" y="270" width="64" height="64" opacity="0.9"/>
    <use href="#spark" x="262" y="470" width="44" height="44" opacity="0.8"/>
  </g>
</svg>
