[package]
name = "hoardmap"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "Disk usage explorer for macOS: directory list, treemap and extension list in the browser"
license = "MIT"

[dependencies]
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# The native window (`--features app`); the command-line build does not pull them in.
muda = { version = "0.19.3", optional = true }
tao = { version = "0.37.2", optional = true }
wry = { version = "0.57.1", optional = true }

# getattrlistbulk, the scanner's fast path on macOS.
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2.191"

[[bin]]
name = "hoardmap-app"
path = "src/bin/hoardmap-app.rs"
required-features = ["app"]

[profile.release]
lto = "thin"
strip = "symbols"

[features]
app = ["dep:muda", "dep:tao", "dep:wry"]
